<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign-up Form</title>
    <link rel="stylesheet" href="./style.css">
    <script src="./script.js" defer></script>
</head>
<body>
    <div class="log-wrapper">
        <img src="./pic/odin-lined.png" alt="odin-lined" class="odin-image">
        <span class="odin">ODIN</span>
    </div>
    <div class="rightside-wrapper">
        <div class="toggle-btn"></div>
        <div class="title">"All the world's a stage,<br>
            And all the men and women merely players;<br>
            They have their exits and their entrances."</div>
        <p class="title">You <em>know</em> what to do.</p>

        <form action="" method="get" id="user_form">
            <svg width="15vw" height="40vh" viewBox="0 0 100 100" preserveAspectRatio="none" id="mypolygon">
                <polygon
                points="
                100,0
                50,0
                0,50
                50,100
                100,100
                50,50
                "
                fill="#F8A5C2"
                stroke="#F8A5C2"
                stroke-width="1"
                />
            </svg>

            <svg  width="15vw" height="40vh" viewBox="0 0 100 100" preserveAspectRatio="none" class="copy1">
                <polygon
                points="
                100,0
                50,0
                0,50
                50,100
                100,100
                50,50
                "
                fill="#F78FB3"
                stroke="#F78FB3"
                stroke-width="1"
                />
            </svg>

            <svg width="15vw" height="40vh" viewBox="0 0 100 100" preserveAspectRatio="none" class="copy2">
                <polygon
                id="mypolygon"
                points="
                100,0
                50,0
                0,50
                50,100
                100,100
                50,50
                "
                fill="#C44569"
                stroke="#C44569"
                stroke-width="1"
                />
            </svg>

            <div class="legend">Let's do this!</div>
            <div class="form-row">
                <div class="form-part">
                    <label for="fname">FIRST NAME*</label>
                    <input type="text" id="fname" name="first_name" placeholder="Bob" required>
                </div>
                <div class="form-part">
                    <label for="lname">LAST NAME*</label>
                    <input type="text" id="lname" name="last_name" placeholder="Smith" required>
                </div>
            </div>
            <div class="form-row">
                <div class="form-part">
                    <label for="email">EMAIL</label>
                    <input type="email" id="email" name="user_email" placeholder="123@example.com" list="myEmail">
                    <datalist id="myEmail">
                        <option data-domain="@gmail.com">@gmail.com</option>
                        <option data-domain="@qq.com">@qq.com</option>
                        <option data-domain="@outlook.com">@outlook.com</option>
                        <option data-domain="@yahoo.com">@yahoo.com</option>
                        <option data-domain="@hotmail.com">@hotmail.com</option>
                        <option data-domain="@proton.com">@proton.com</option>
                    </datalist>
                </div>
                <div class="form-part">
                    <label for="pnumber">PHONE NUMBER</label>
                    <input type="tel" id="pnumber" name="user_pnumber">
                </div>
            </div>
            <div class="form-row">
                <div class="form-part">
                    <label for="password">PASSWORD*</label>
                    <input 
                    type="password" 
                    id="password" 
                    name="user_password" 
                    pattern="^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)[a-zA-Z\d\W]{8,}$"
                    required>
                    <span class="checkmark1"></span>
                    <div class="error-message1"></div>
                </div>
                <div class="form-part">
                    <label for="password-confirm">CONFIRM PASSWORD*</label>
                    <input type="password" id="password-confirm" name="password_confirm" required>
                    <span class="checkmark2"></span>
                    <div class="error-message2"></div>
                </div>
            </div>
        </form>

        <button type="submit" form="user_form">Create Account</button>
        <p class="footer">Already have an account? <span>Log in</span></p>
    </div>
</body>
</html>
